# ~/.config/hypr/hypridle.conf
# hypridle still uses classic hyprlang syntax, not Lua.
# This config only wires lock-before-suspend — no idle timeouts configured yet.

general {
    lock_cmd = pidof hyprlock || hyprlock   # avoid spawning a second hyprlock instance
    before_sleep_cmd = loginctl lock-session  # triggers general:lock_cmd via logind, blocks suspend until locked
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")' # avoid needing to press a key twice to wake the display

    # 2 = auto-detect (waits for hyprlock specifically before allowing sleep to proceed)
    # 3 = wait for ANY wayland session-lock client to confirm lock
    inhibit_sleep = 2
}

listener {
    timeout = 600              # 10 minutes
    on-timeout = loginctl lock-session   # goes through general:lock_cmd, same guard against double-spawn
}

listener {
    timeout = 900              # 15 minutes — screen off, separate from the lock at 10min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Add more listener {} blocks here later for suspend-on-idle if you want it.
