# ~/.config/hypr/hyprlock.conf
# hyprlock still uses classic hyprlang syntax (key = value), not Lua.

general {
    disable_loading_bar = false
    grace = 2                # seconds after unlock before re-lock is required
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = screenshot         # blurs whatever's on screen; swap for a file path if you prefer a static wallpaper
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(89b4faee)
    inner_color = rgba(1e1e2eee)
    font_color = rgba(cdd6f4ee)
    fade_on_empty = true
    placeholder_text = <span foreground="##cdd6f4">Password...</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cdd6f4ee)
    font_size = 90
    font_family = JetBrains Mono
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(a6adc8ee)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(cdd6f4ee)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -50
    halign = center
    valign = center
}
